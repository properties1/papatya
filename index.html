<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papatyam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0e15;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
  </div>

  <!-- Havai Fişek Efekti İçin Canvas Confetti Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Animasyon Parametreleri
    let progress = 0;
    const speed = 0.008; // Çizim hızı

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const scale = Math.min(canvas.width / 800, canvas.height / 600);

      // --- 1. Renkli "Papatyam" Yazısı ---
      ctx.save();
      ctx.font = `bold ${60 * scale}px cursive, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Rengarenk Çizgi / Gradient Efekti
      const gradient = ctx.createLinearGradient(centerX - 200 * scale, 0, centerX + 200 * scale, 0);
      gradient.addColorStop(0, '#ff4e50');
      gradient.addColorStop(0.2, '#f9d423');
      gradient.addColorStop(0.4, '#e1eec3');
      gradient.addColorStop(0.6, '#f05f57');
      gradient.addColorStop(0.8, '#36d1dc');
      gradient.addColorStop(1, '#5b86e5');

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 3 * scale;

      // Yazının çizilme simülasyonu
      const textProgress = Math.min(progress * 2, 1);
      if (textProgress > 0) {
        ctx.setLineDash([400 * textProgress, 400]);
        ctx.strokeText("Papatyam", centerX - 60 * scale, centerY);
        
        // Dolgu rengi yavaşça belirsin
        ctx.fillStyle = `rgba(255, 255, 255, ${textProgress * 0.9})`;
        ctx.fillText("Papatyam", centerX - 60 * scale, centerY);
      }
      ctx.restore();

      // --- 2. Papatya Çizimi ---
      const flowerProgress = Math.max(0, (progress - 0.5) * 2);
      if (flowerProgress > 0) {
        const flowerX = centerX + 180 * scale;
        const flowerY = centerY;
        const petalCount = 12;
        const maxPetalRadius = 35 * scale;
        const centerRadius = 15 * scale;

        // Yeşil Dal
        ctx.beginPath();
        ctx.strokeStyle = '#4CAF50';
        ctx.lineWidth = 4 * scale;
        ctx.moveTo(flowerX, flowerY);
        ctx.quadraticCurveTo(flowerX + 10 * scale, flowerY + 50 * scale, flowerX, flowerY + 100 * scale);
        ctx.stroke();

        // Yapraklar
        for (let i = 0; i < petalCount; i++) {
          const angle = (i * 2 * Math.PI) / petalCount;
          const currentPetalLength = maxPetalRadius * Math.min(flowerProgress * 1.5, 1);

          ctx.save();
          ctx.translate(flowerX, flowerY);
          ctx.rotate(angle);

          ctx.beginPath();
          ctx.ellipse(currentPetalLength / 2, 0, currentPetalLength / 2, 8 * scale, 0, 0, 2 * Math.PI);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();
          ctx.strokeStyle = '#E0E0E0';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.restore();
        }

        // Orta Sarı Göbek
        if (flowerProgress > 0.3) {
          ctx.beginPath();
          ctx.arc(flowerX, flowerY, centerRadius * Math.min((flowerProgress - 0.3) * 1.4, 1), 0, 2 * Math.PI);
          ctx.fillStyle = '#FFD700';
          ctx.fill();
          ctx.strokeStyle = '#FFA500';
          ctx.lineWidth = 2 * scale;
          ctx.stroke();
        }
      }

      // Döngü veya Bitiş Kontrolü
      if (progress < 1) {
        progress += speed;
        requestAnimationFrame(drawScene);
      } else {
        triggerFireworks();
      }
    }

    // --- 3. Havai Fişek Efekti ---
    let fireworksTriggered = false;
    function triggerFireworks() {
      if (fireworksTriggered) return;
      fireworksTriggered = true;

      const duration = 4 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);

        confetti({
          particleCount,
          startVelocity: 30,
          spread: 360,
          ticks: 60,
          origin: { x: Math.random(), y: Math.random() - 0.2 }
        });
      }, 250);
    }

    // Başlat
    drawScene();
  </script>
</body>
</html>
